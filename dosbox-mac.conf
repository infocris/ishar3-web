# DOSBox Staging (0.83) config for Ishar 3 on macOS.
# The title menu needs an absolute-position mouse (hover / highlight).
# 1280x800 window = 4x 320x200, no aspect correction, so the macOS
# pointer lands exactly on the menu lines.

[sdl]
fullscreen = off
window_size = 1280x800
output = opengl

[dosbox]
machine = svga_s3
memsize = 16

[render]
shader = sharp
aspect = off
integer_scaling = off

[cpu]
core = auto
cputype = auto
cpu_cycles = 7000
cpu_cycles_protected = auto
cycleup = 1000
cycledown = 1000

[mixer]
nosound = false
rate = 44100
blocksize = 1024
prebuffer = 25

[midi]
mpu401 = intelligent
mididevice = coreaudio

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5
sbmixer = true
oplmode = auto

[gus]
gus = false

[speaker]
pcspeaker = impulse

[mouse]
mouse_capture = seamless
mouse_middle_release = on
mouse_raw_input = off
mouse_sensitivity = 100
builtin_dos_mouse_driver = on
builtin_dos_mouse_driver_model = 2button

[joystick]
joysticktype = none

[serial]
serial1 = dummy
serial2 = dummy
serial3 = disabled
serial4 = disabled

[dos]
xms = true
ems = true
umb = true
keyboard_layout = us

[autoexec]
@echo off
mount C "."
c:
cls
start.exe start.stp
exit
