[sdl]
autolock=false

[dosbox]
machine=svga_s3
memsize=16

[render]
aspect=false

[cpu]
core=auto
cputype=auto
cycles=7000

[mixer]
nosound=false
rate=44100
blocksize=1024
prebuffer=25

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto

[gus]
gus=false

[speaker]
pcspeaker=true
disney=true

[midi]
mpu401=intelligent
mididevice=default

[dos]
xms=true
ems=true
umb=true

[autoexec]
@echo off
mount c .
c:
cls
start.exe start.stp
